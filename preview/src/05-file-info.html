<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link href="preview.css" rel="stylesheet">
    <title>rView</title>
  </head>
  <body>
    <header>
      <div class="brand"><img alt="" src="../../assets/icon/rview.png">rView<small>Image viewer for Windows</small></div>
      <div class="steps"><i></i><i></i><i></i><i></i><i class="on"></i><span>05 / 05</span></div>
    </header>
    <main>
      <div class="shot crop" style="--ratio: 1.3; --focus: 56% 0; --trim: 0.048"><img alt="" src="../screenshots/5.png"></div>
      <div class="copy">
        <p class="tag">File info</p>
        <h1>Everything about the file, one click to copy.</h1>
        <p class="sub">Size, dates, dimensions, camera data and metadata. On export, keep the metadata, drop the location or strip it all.</p>
        <dl>
        <dt><kbd>I</kbd></dt><dd>Show File Info</dd>
        <dt><kbd>&lt;</kbd></dt><dd>Show in Explorer</dd>
        </dl>
      </div>
    </main>
  </body>
</html>
