<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link href="preview.css" rel="stylesheet">
    <title>rView</title>
  </head>
  <body>
    <header>
      <div class="brand"><img alt="" src="../../assets/icon/rview.png">rView<small>Image viewer for Windows</small></div>
      <div class="steps"><i></i><i class="on"></i><i></i><i></i><i></i><span>02 / 05</span></div>
    </header>
    <main>
      <div class="shot"><img alt="" src="../screenshots/2.png"></div>
      <div class="copy">
        <p class="tag">Markup</p>
        <h1>Point at the detail that matters.</h1>
        <p class="sub">Shapes, arrows, text, a loupe and redactions on top of the image. Each one stays editable, and the original file is never touched.</p>
        <dl>
        <dt><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>A</kbd></dt><dd>Open Markup</dd>
        <dt><kbd>Enter</kbd></dt><dd>Confirm the object</dd>
        <dt><kbd>Ctrl</kbd><kbd>Z</kbd></dt><dd>Undo any step</dd>
        </dl>
      </div>
    </main>
