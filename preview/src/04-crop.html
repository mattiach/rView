<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link href="preview.css" rel="stylesheet">
    <title>rView</title>
  </head>
  <body>
    <header>
      <div class="brand"><img alt="" src="../../assets/icon/rview.png">rView<small>Image viewer for Windows</small></div>
      <div class="steps"><i></i><i></i><i></i><i class="on"></i><i></i><span>04 / 05</span></div>
    </header>
    <main>
      <div class="shot crop" style="--ratio: 1.3; --focus: 66% 0; --trim: 0.048"><img alt="" src="../screenshots/4.png"></div>
      <div class="copy">
        <p class="tag">Crop</p>
        <h1>The right size for every feed.</h1>
        <p class="sub">Presets for Instagram, Facebook, X, YouTube and LinkedIn, the usual ratios or your own. Rotate and flip too.</p>
        <dl>
        <dt><kbd>C</kbd></dt><dd>Crop tool</dd>
        <dt><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>A</kbd></dt><dd>Open Markup</dd>
        </dl>
      </div>
    </main>
  </body>
