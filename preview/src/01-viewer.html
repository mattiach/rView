<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link href="preview.css" rel="stylesheet">
    <title>rView</title>
  </head>
  <body>
    <header>
      <div class="brand"><img alt="" src="../../assets/icon/rview.png">rView<small>Image viewer for Windows</small></div>
      <div class="steps"><i class="on"></i><i></i><i></i><i></i><i></i><span>01 / 05</span></div>
    </header>
    <main>
      <div class="shot"><img alt="" src="../screenshots/1.png"></div>
      <div class="copy">
        <p class="tag">Viewer</p>
        <h1>Open an image. Arrow through the folder.</h1>
        <p class="sub">Rendered on the GPU, with the next files preloaded in the direction you are moving. Everything else is one right-click away.</p>
        <dl>
        <dt><kbd>&larr;</kbd><kbd>&rarr;</kbd></dt><dd>Previous / next file</dd>
        <dt><kbd>R</kbd></dt><dd>Random file</dd>
        <dt><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>O</kbd></dt><dd>Open an image from a URL</dd>
        </dl>
      </div>
    </main>
  </body>
</html>
