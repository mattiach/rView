name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job can write, and only for the owner's tags.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install || rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Read app version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Build release exe
        run: cargo build --release -p rview --bin rview

      - name: Third-party notices are up to date
        run: python scripts/third_party_notices.py --check

      - name: Name exe after version
        shell: bash
        run: cp target/release/rview.exe "rview-${{ steps.version.outputs.version }}-windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: rview-${{ steps.version.outputs.version }}-windows-x64
          path: |
            rview-${{ steps.version.outputs.version }}-windows-x64.exe
            THIRD-PARTY-NOTICES.txt

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Check dependencies against the RustSec advisory database
        run: cargo audit

  release:
    needs: [build, audit]
    if: github.ref_type == 'tag' && github.repository == 'mattiach/rview' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rview-${{ needs.build.outputs.version }}-windows-x64

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rview-${{ needs.build.outputs.version }}-windows-x64.exe
            THIRD-PARTY-NOTICES.txt
          generate_release_notes: true
